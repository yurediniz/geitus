# Configuracao da aplicacao ERPell (backend).
# Valores sensiveis NAO ficam no codigo: sao lidos de variaveis de ambiente.
# O formato ${VARIAVEL:padrao} usa o valor padrao apenas em desenvolvimento local.

spring:
  application:
    name: ERPell

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/erpell}
    username: ${POSTGRES_USER:erpell}
    password: ${POSTGRES_PASSWORD:erpell}

  jpa:
    hibernate:
      # O schema e gerenciado pelo Flyway; o Hibernate apenas valida.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# Spring Boot Actuator: nesta etapa expomos apenas o health check.
# Nenhum endpoint sensivel (env, beans, mappings, etc.) fica exposto.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Nao expor detalhes internos (status de componentes) sem autenticacao.
      show-details: never

# Configuracoes especificas do ERPell
erpell:
  cors:
    # Origens liberadas para o frontend local (Vite). Separe por virgula se houver mais de uma.
    allowed-origins: ${ERPELL_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # JWT preparado para a etapa futura de autenticacao (ainda nao utilizado).
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:86400000}
