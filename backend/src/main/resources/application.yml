# Configuracao da aplicacao Geitus (backend).
# Valores sensiveis NAO ficam no codigo: sao lidos de variaveis de ambiente.
# O formato ${VARIAVEL:padrao} usa o valor padrao apenas em desenvolvimento local.

spring:
  application:
    name: Geitus

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/geitus_db}
    username: ${POSTGRES_USER:geitus}
    password: ${POSTGRES_PASSWORD:geitus}

  jpa:
    hibernate:
      # O schema e gerenciado pelo Flyway; o Hibernate apenas valida.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Falha (em vez de so avisar) se uma consulta paginada fizer JOIN FETCH de
        # colecao: impede o Hibernate de paginar em memoria quando a listagem de
        # produtos ganhar paginacao com os codigos de barras (Fase E).
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Envio da imagem do produto (Fase F, DEC-040): o navegador ja comprime a
  # grande (ate 400 KB) e a miniatura (ate 40 KB). Acima disto o servidor
  # recusa com 413 antes de ler o corpo inteiro.
  servlet:
    multipart:
      max-file-size: 512KB
      max-request-size: 1MB

server:
  port: ${SERVER_PORT:8080}

# Spring Boot Actuator: nesta etapa expomos apenas o health check.
# Nenhum endpoint sensivel (env, beans, mappings, etc.) fica exposto.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Nao expor detalhes internos (status de componentes) sem autenticacao.
      show-details: never

# Configuracoes especificas do Geitus
geitus:
  bootstrap:
    # Habilita o bootstrap idempotente do admin de DESENVOLVIMENTO (ver DevAdminBootstrap).
    # Mapeia a env var GEITUS_BOOTSTRAP_DEV_ADMIN para a property idiomatica do Spring.
    dev-admin: ${GEITUS_BOOTSTRAP_DEV_ADMIN:false}
  cors:
    # Origens liberadas para o frontend local (Vite). Separe por virgula se houver mais de uma.
    allowed-origins: ${GEITUS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # JWT usado na autenticacao. O segredo (HS256) precisa ter no minimo 32 bytes
    # (256 bits); caso contrario a aplicacao NAO sobe (fail-fast, ver JwtSecretValidator).
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:86400000}

  imagens:
    # Segredo do HMAC-SHA256 das URLs assinadas das imagens dos produtos
    # (DEC-040). No minimo 32 bytes e DIFERENTE do JWT_SECRET; sem ele a
    # aplicacao NAO sobe (fail-fast, ver SegredoDeImagemValidator).
    segredo: ${GEITUS_IMAGEM_SEGREDO:}

# Documentacao da API (springdoc / Swagger UI). Voltada ao desenvolvimento.
# NAO expor em producao sem decisao futura (ver DEC-012 no decision-log).
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
