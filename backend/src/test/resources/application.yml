# Configuracao de testes do backend do ERPell.
#
# Fornece um segredo JWT valido (>= 32 bytes) apenas para os testes, evitando
# depender de variaveis de ambiente externas. Nenhum segredo real aqui.
erpell:
  cors:
    allowed-origins: http://localhost:5173
  security:
    jwt:
      secret: segredo-de-teste-apenas-para-os-testes-do-erpell-1234567890
      expiration: 86400000
